name: macos

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            architecture: arm64
          - os: macos-13
            architecture: x86_64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: MacOS setup
      run: |
        brew install autoconf automake wget
    - name: Dependencies
      run: |
        mkdir build && cd build
        cp ../depends/macos/zlib-1.2.11.tar.gz zlib.tar.gz
        cp ../depends/macos/expat-2.2.8.tar.gz expat.tar.gz
        cp ../depends/macos/c-ares-1.15.0.tar.gz cares.tar.gz
        cp ../depends/macos/sqlite-autoconf-3300000.tar.gz sqlite.tar.gz
        cp ../depends/macos/gmp-6.3.0.tar.bz2 gmp.tar.gz
        cp ../depends/macos/libgpg-error-1.36.tar.bz2 libgpgerror.tar.gz
        cp ../depends/macos/libgcrypt-1.8.5.tar.bz2 libgcrypt.tar.gz
        cp ../depends/macos/libssh2-1.9.0.tar.gz libssh2.tar.gz

        cp ../depends/macos/cppunit-1.12.1.tar.gz cppunit.tar.gz
    - name: Build aria2
      run: |
        cd build
        ln -s ../makerelease-osx-v2.mk ./Makefile
        ln -s ../configure.ac ./configure.ac
        make ARCH=${{ matrix.architecture }}
        strip aria2-def/bin/aria2c
        upx aria2-def/binc/aria2c
        otool -L aria2-def/bin/aria2c
        file aria2-def/bin/aria2c
        cp aria2-def/bin/aria2c ../aria2c
    - name: Upload artifact
      uses: actions/upload-artifact@master
      with:
        name: aria_${{ matrix.os }}
        path: aria2c