name: macos

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-13]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: MacOS setup
      run: |
        brew install cppunit gettext openssl libssh2 c-ares sqlite3 \
          autoconf automake pkg-config libtool libuv libxml2 zlib upx libuv
        cp ./depends/macos/c-ares-1.17.2.tar.gz ./c-ares.tar.gz
        tar xf c-ares.tar.gz
        cd c-ares-*;
        ./configure --disable-shared
        make -j"$(nproc 2> /dev/null || sysctl -n hw.ncpu)"
        make install -j"$(nproc 2> /dev/null || sysctl -n hw.ncpu)"
    - name: Setup clang (MacOS)
      run: |
        echo 'CC=clang' >> $GITHUB_ENV
        echo 'CXX=clang++' >> $GITHUB_ENV
    - name: Libtool
      run: |
        autoreconf -i
    - name: Setup compiler flags
      run: |
        asanflags="-fsanitize=address,undefined -fno-sanitize-recover=undefined"

        LDFLAGS="$asanflags -L/usr/local/opt/libxml2/lib -L/usr/local/opt/zlib/lib -L/usr/local/opt/openssl@1.1/lib -L/usr/local/opt/sqlite3/lib -L/usr/local/lib -L/usr/local/opt/libuv/lib";
        CPPFLAGS="$asanflags -o2 -I/usr/local/opt/libxml2/include -I/usr/local/opt/zlib/include -I/usr/local/opt/openssl@1.1/include -I/usr/local/opt/sqlite3/include -I/usr/local/include -I/usr/local/opt/libuv/include";
        PKG_CONFIG_PATH="/usr/local/opt/sqlite3/lib/pkgconfig:/usr/local/opt/libxml2/lib/pkgconfig:/usr/local/opt/zlib/lib/pkgconfig:/usr/local/opt/openssl@1.1/lib/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/opt/libuv/lib/pkgconfig";

        echo 'CPPFLAGS='"$CPPFLAGS" >> $GITHUB_ENV
        echo 'LDFLAGS='"$LDFLAGS" >> $GITHUB_ENV
    - name: Configure autotools (macOS)
      run: |
        ./configure \
          --enable-static \
          --disable-shared \
          --enable-metalink \
          --enable-bittorrent \
          --disable-nls \
          --with-appletls \
          --with-libgmp \
          --with-sqlite3 \
          --with-libz \
          --with-libexpat \
          --with-libcares \
          --with-libgcrypt \
          --with-libssh2 \
          --without-libuv \
          --without-gnutls \
          --without-openssl \
          --without-libnettle \
          --without-libxml2 \
          ARIA2_STATIC=yes
    - name: Build aria2
      run: |
        make -j"$(nproc 2> /dev/null || sysctl -n hw.ncpu)" check
        strip src/aria2c
        upx src/aria2c
        otool -L src/aria2c
        file src/aria2c
    - name: Upload artifact
      uses: actions/upload-artifact@master
      with:
        name: aria_${{ matrix.os }}
        path: src/aria2c